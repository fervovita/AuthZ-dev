# Generator-found (TestCheckAgreesWithTheFixedPoint): the shape is arbitrary, not designed.
name: a component found through a chain of answers
schema:
  team:
    relations:
      viewer_d: [user, "team#viewer", "team#owner", "team#banned"]
      banned_d: [user, "team#viewer", "team#member", "team#banned", "team#owner"]
      member_d: ["user:*", "team#member", "team#banned"]
    permissions:
      viewer:
        any:
          - any: [member, viewer]
          - viewer_d
      owner:
        all: [member, banned]
      banned:
        all:
          - all: [viewer, member]
          - all: [viewer, banned_d]
      member:
        any:
          - all: [member_d, viewer]
          - all: [member_d, banned]
tuples:
  - team:1#banned_d@user:alice
  - team:1#member_d@user:*
  - team:1#member_d@team:3#banned
  - team:2#viewer_d@team:1#banned
  - team:2#viewer_d@user:alice
  - team:2#banned_d@team:4#viewer
  - team:2#banned_d@team:3#viewer
  - team:2#member_d@team:4#member
  - team:2#member_d@user:*
  - team:3#viewer_d@user:alice
  - team:3#viewer_d@team:3#viewer
  - team:3#banned_d@team:1#member
  - team:3#banned_d@team:2#banned
  - team:3#member_d@user:*
  - team:3#member_d@team:1#member
  - team:4#viewer_d@team:4#owner
  - team:4#viewer_d@team:3#banned
  - team:4#banned_d@team:2#owner
  - team:4#banned_d@team:3#owner
  - team:4#member_d@team:2#banned
checks:
  - check: team:4#banned@user:alice
    expect: true
    why: reached during settling, and only correct once it is settled with the rest

  - check: team:4#viewer@user:alice
    expect: true
    why: the same, one edge further out

  - check: team:1#member@user:alice
    expect: false
    why: >-
      the wildcard on team:1#member_d grants, but member also needs viewer or banned
      on team:1, and neither holds
