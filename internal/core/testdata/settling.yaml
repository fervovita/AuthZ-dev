# Generator-found (TestCheckAgreesWithTheFixedPoint): the shape is arbitrary, not designed.
name: settling pulls in relations the traversal never reached
schema: |
  definition user {}

  definition team {
    relation viewer_d: user | team#owner
    relation banned_d: user | team#owner | team#banned
    relation member_d: user | team#member | team#banned
    permission viewer = (owner + banned) & (viewer_d & banned)
    permission owner = (banned & viewer) & (viewer & member)
    permission banned = viewer + (owner + banned_d)
    permission member = member_d & (member_d + viewer)
  }
tuples:
  - team:1#viewer_d@team:2#owner
  - team:1#banned_d@user:alice
  - team:1#member_d@team:2#banned
  - team:1#member_d@user:alice
  - team:2#viewer_d@user:alice
  - team:2#banned_d@team:1#owner
  - team:2#banned_d@team:1#banned
  - team:2#member_d@team:1#member
checks:
  - check: team:1#owner@user:alice
    expect: true
    why: >-
      viewer(1) only reaches team:2#owner once banned(1) is known, which the traversal
      learns too late; team:2#owner then needs a further round of its own

  - check: team:1#viewer@user:alice
    expect: true
    why: the branch that was short-circuited past is the one that grants it

  - check: team:2#owner@user:alice
    expect: true
    why: the relation settling pulled in
